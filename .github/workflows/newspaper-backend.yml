name: GenAI newspaper backend

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Bootstrap the first issue or run the daily update"
        required: true
        type: choice
        options:
          - bootstrap
          - daily
        default: bootstrap

permissions:
  contents: read

concurrency:
  group: genai-newspaper-backend
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ vars.VERCEL_APP_URL || 'https://genai-intelligence.vercel.app' }}
      CRON_SECRET: ${{ secrets.VERCEL_CRON_SECRET }}
      MODE: ${{ inputs.mode || 'daily' }}
    steps:
      - name: Check required connection setting
        shell: bash
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "Add the existing Vercel CRON_SECRET as the GitHub Actions secret VERCEL_CRON_SECRET."
            exit 1
          fi
          echo "Backend target: $APP_URL"
          echo "Run mode: $MODE"

      - name: Collect, index, and publish
        shell: bash
        run: |
          set -euo pipefail

          call_endpoint() {
            local route="$1"
            curl --silent --show-error --fail-with-body \
              --connect-timeout 10 --max-time 310 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/${route}"
          }

          collect_response="$(call_endpoint collect)"
          echo "## Collection" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$collect_response" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [[ "$MODE" == "daily" ]]; then
            index_response="$(call_endpoint index)"
            echo "## Indexing" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$index_response" | jq . >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            edition_response="$(call_endpoint edition)"
            echo "## Weekly edition" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$edition_response" | jq . >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$(echo "$edition_response" | jq -r '.status // empty')" == "waiting_for_provider" ]]; then
              echo "The edition step could not reach a text-generation provider. See the Vercel run details and /status." >&2
              exit 1
            fi
            exit 0
          fi

          # First launch: work through several small, tracked batches so the first
          # complete issue can be prepared before the public reader is released.
          for batch in 1 2 3 4; do
            echo "### Bootstrap batch ${batch}" >> "$GITHUB_STEP_SUMMARY"
            index_response="$(call_endpoint index)"
            echo "Index response: $(echo "$index_response" | jq -c .)" >> "$GITHUB_STEP_SUMMARY"

            edition_response="$(call_endpoint edition)"
            edition_status="$(echo "$edition_response" | jq -r '.status // empty')"
            echo "Edition response: $(echo "$edition_response" | jq -c .)" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$edition_status" == "waiting_for_provider" ]]; then
              echo "Text generation is unavailable. The reader will remain in preparation mode." >&2
              exit 1
            fi

            status_response="$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 30 "${APP_URL}/api/status")"
            current_edition="$(echo "$status_response" | jq -r '.current_edition.status // empty')"
            if [[ "$current_edition" == "published" ]]; then
              echo "First issue is published. The reader is ready." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          echo "Bootstrap is still in progress. The daily workflow will continue it; rerun Bootstrap from Actions to continue sooner." >> "$GITHUB_STEP_SUMMARY"
