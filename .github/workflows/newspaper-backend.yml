name: GenAI newspaper backend

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Initialize the database and first issue, or run the daily update"
        required: true
        type: choice
        options:
          - bootstrap
          - daily
        default: bootstrap

permissions:
  contents: read

concurrency:
  group: genai-newspaper-backend
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODE: ${{ inputs.mode || 'daily' }}
    steps:
      - name: Check backend configuration
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "Add the Neon Postgres connection string as the GitHub Actions secret DATABASE_URL."
            exit 1
          fi
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "Add GEMINI_API_KEY as a GitHub Actions secret; the indexer needs it for embeddings."
            exit 1
          fi
          if [[ -z "$GROQ_API_KEY" ]]; then
            echo "GROQ_API_KEY is not set. The worker can use Gemini for analysis if its free quota permits."
          fi
          echo "Mode: $MODE"

      - name: Start independent backend worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend
        run: python -m pip install .

      - name: Collect, index, and publish directly to Postgres
        run: python -m genai_intelligence.worker --mode "$MODE"
