[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-intelligence"
version = "0.5.0"
description = "A free-first GenAI document indexing and weekly research notebook pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0.11", "PyYAML>=6.0.2", "httpx>=0.27.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "psycopg[binary]>=3.2", "beautifulsoup4>=4.12.3", "pypdf>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
genai-intel = "genai_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genai_intelligence = ["notebook.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
