[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-intelligence"
version = "0.2.0"
description = "A free, local-first GenAI technology intelligence newspaper pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0.11", "PyYAML>=6.0.2", "httpx>=0.27.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
genai-intel = "genai_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
